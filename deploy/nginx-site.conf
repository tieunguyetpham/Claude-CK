# Server block cho tên miền (chỉ dùng khi VPS CHƯA có cấu hình cho tieunguyetpham.store).
# Certbot sẽ tự thêm phần HTTPS (443) khi chạy: certbot --nginx -d tieunguyetpham.store -d www.tieunguyetpham.store

server {
    listen 80;
    listen [::]:80;
    server_name tieunguyetpham.store www.tieunguyetpham.store;

    include snippets/trading.conf;

    location = / {
        return 302 /trading/;
    }
}
