  # ===== trading.tieunguyetpham.store (app phân tích chứng khoán) =====
  # Chèn khối này vào trong http { } của /opt/ppmeeting/infra/nginx/nginx.conf
  server {
    listen 443 ssl;
    http2 on;
    server_name trading.tieunguyetpham.store;

    # Dùng chung chứng chỉ của ppmeeting (đã bổ sung tên miền trading)
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    # Phân giải tên container lúc có request: Nginx vẫn khởi động được khi trading-app đang dừng
    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
      set $trading_upstream http://trading-app:8501;
      proxy_pass $trading_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 86400s;
      proxy_buffering off;
    }
  }
  # ===== hết trading =====
